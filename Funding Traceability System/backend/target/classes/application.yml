server:
  port: 8080
  # context-path 保持根，不设置

spring:
  servlet:
    multipart:
      # 回访凭证上传大小限制
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    # 业务流水库：仅存虚拟ID、金额、流转节点等业务数据
    business:
      jdbc-url: ${DB_URL:jdbc:mysql://localhost:3306/funding_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:123456}
      driver-class-name: com.mysql.cj.jdbc.Driver
    # 隐私库：学生敏感信息 AES 加密独立存储，通过 virtual_id 映射关联
    privacy:
      jdbc-url: ${PRIVACY_DB_URL:jdbc:mysql://localhost:3306/funding_privacy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:123456}
      driver-class-name: com.mysql.cj.jdbc.Driver

  redis:
    host: 127.0.0.1
    port: 6379
    password:
    database: 0
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

# 注意：双数据源手工装配后，mybatis-plus 全局 yml 配置不再生效，
# 下划线转驼峰/日志/分页插件在 BusinessDataSourceConfig 与 PrivacyDataSourceConfig 内显式设置

jwt:
  secret: funding-traceability-secret-key-2024-very-long
  expire: 86400000

# 资助凭证溯源核验二维码
verify:
  # 核验码 HMAC 签名密钥（生产环境应通过环境变量注入；变更后旧二维码全部失效）
  secret: ${VERIFY_SECRET:funding-verify-secret-2024}
  # 扫码后跳转的公开核验页地址（前端 hash 路由，末尾不带斜杠）
  page-base-url: ${VERIFY_PAGE_BASE_URL:http://localhost:8081/#/verify}

funding:
  review:
    # 大额复核阈值（元），审核通过后达到该金额自动进入复核候选池
    threshold: 5000
  privacy:
    # 学生隐私字段 AES 密钥（必须16位），生产环境应通过环境变量注入
    aes-key: ${PRIVACY_AES_KEY:FundingPrivacy16}
  upload:
    # 回访脱敏凭证材料存储目录（相对工作目录，与 upload/attachments 同根）
    dir: upload/visit-material

logging:
  level:
    com.funding: debug
privacy:
  sensitive-session-expire: 15
