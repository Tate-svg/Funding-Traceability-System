# 助学帮扶管理系统 Nginx 站点配置
# 放置位置：/etc/nginx/conf.d/funding.conf
# 作用：托管前端 dist 静态资源 + 将 /api 反向代理到 Spring Boot

server {
    listen 80;
    # 无域名时保持 _，有域名后改成 your-domain.com
    server_name _;

    root /opt/funding/dist;
    index index.html;

    # 材料上传最多 10MB，留出余量
    client_max_body_size 20m;

    charset utf-8;

    # 前端为 hash 路由，静态资源 + 兜底回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /static/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 后端 API 反向代理（同域，无需 CORS）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 导出 Excel 等大响应不做缓冲，避免超时
    location /api/funds/export {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
